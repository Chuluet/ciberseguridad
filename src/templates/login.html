{% extends "base.html" %}
{% block title %}SIGA - Ingreso{% endblock %}
{% block content %}
<div class="card-outer">
  <div class="wrap card">
    <div class="logo-row">
      <div class="logo-mark"></div>
      <span class="logo-text">SIGA</span>
    </div>
    <h1 class="accent">Ingreso de estudiante</h1>
    <p class="subtitle">Usa tus credenciales</p>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post">
      <label>Usuario</label>
      <input type="text" name="usuario" autocomplete="off">
      <label>Contraseña</label>
      <input type="text" name="password" autocomplete="off">
      <button type="submit">Ingresar</button>
    </form>

    <p class="helper">
      Prueba de SQLi — usuario: <code>admin' --</code>, contraseña: (vacía)
    </p>
  </div>
</div>
{% endblock %}
