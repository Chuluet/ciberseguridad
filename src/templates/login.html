{% extends "base.html" %}
{% block title %}SIGA - Ingreso{% endblock %}
{% block crumb %}Login{% endblock %}

{% block content %}
<div class="page-head">
  <h1 class="accent">Ingreso de estudiante</h1>
  <p>Usa tus credenciales institucionales para acceder al portal.</p>
</div>

<div class="card" style="max-width: 380px;">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label>Usuario</label>
    <input type="text" name="usuario" autocomplete="off" placeholder="ej. jperez">
    <label>Contraseña</label>
    <input type="text" name="password" autocomplete="off" placeholder="••••••••">
    <button type="submit" class="block">Ingresar</button>
  </form>

</div>
{% endblock %}
